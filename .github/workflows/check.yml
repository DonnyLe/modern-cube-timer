name: Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bun run format:check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e:production
      - run: bun run test:e2e --grep "scrambles load and refresh without worker errors"
